<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>RUNCORE WATER MAP — Lecce</title>
  <meta name="description" content="Trova le fontanelle pubbliche a Lecce. RUNCORE WATER MAP.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { color-scheme: dark; --yellow:#FFF48D; --black:#111; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--black); color:#fff;
      font-family:Arial,Helvetica,sans-serif; }
    .shell { width:100%; height:100vh; height:100dvh; display:flex;
      flex-direction:column; overflow:hidden; }
    header { flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
      gap:16px; flex-wrap:wrap; padding:18px 22px 14px; }
    .brand { color:#fff; font-size:clamp(22px,4vw,32px); line-height:1;
      font-weight:950; letter-spacing:1.5px; }
    .tagline { margin-top:7px; color:var(--yellow); font-size:11px;
      font-weight:800; letter-spacing:2.5px; }
    .actions { display:flex; gap:9px; flex-wrap:wrap; }
    button { border:0; border-radius:3px; padding:12px 15px; background:var(--yellow);
      color:#111; font-weight:900; cursor:pointer; }
    button:focus-visible { outline:3px solid white; outline-offset:3px; }
    .status { flex:0 0 auto; padding:10px 22px; background:#202020; color:var(--yellow);
      font-size:11px; letter-spacing:1px; min-height:35px; }
    #map { width:100%; flex:1 1 auto; min-height:0; background:#ddd; }
    footer { flex:0 0 auto; display:flex; justify-content:space-between; gap:10px;
      flex-wrap:wrap; padding:10px 22px; color:#aaa; font-size:11px; }
    footer a { color:#ddd; }
    .pin { width:30px; height:30px; display:flex; align-items:center; justify-content:center;
      border:2px solid #111; border-radius:50%; background:var(--yellow);
      box-shadow:0 2px 8px #0008; }
    .pin-wrap { background:transparent; border:0; }
    .leaflet-popup-content-wrapper { border-radius:4px; }
    .popup { color:#151515; min-width:165px; line-height:1.4; }
    .popup strong { font-size:14px; }
    .popup small { display:block; margin-top:5px; color:#555; }
    .popup a { color:#111; font-weight:bold; }
    @media(max-width:600px) {
      header { padding:14px 14px 11px; gap:12px; }
      .brand { font-size:22px; }
      .tagline { font-size:9px; letter-spacing:2px; }
      .actions { width:100%; }
      .actions button { flex:1; padding:11px 9px; font-size:11px; }
      .status, footer { padding-left:14px; padding-right:14px; }
      footer { font-size:10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="brand">RUNCORE | WATER MAP</div>
        <div class="tagline">FIND WATER. KEEP RUNNING.</div>
      </div>
      <div class="actions">
        <button id="locate" type="button">◎ DOVE SONO</button>
      </div>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">
      PREPARAZIONE DELLA MAPPA...
    </div>
    <div id="map" aria-label="Mappa delle fontanelle a Lecce"></div>
    <footer>
      <span>● FONTANELLE · LECCE</span>
      <span>I punti possono essere incompleti: verifica sul posto che l’acqua sia potabile.</span>
      <span>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></span>
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
  (() => {
    const DATA_FILE = 'fontanelle.geojson';
    const $ = id => document.getElementById(id);
    const status = $('status');

    const map = L.map('map').setView([40.3515, 18.1750], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const pointsLayer = L.layerGroup().addTo(map);

    const drop = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#1e88e5" stroke="#111" stroke-width="1.5">' +
      '<path d="M12 2.5C12 2.5 5 10 5 14.5a7 7 0 0 0 14 0C19 10 12 2.5 12 2.5z"/></svg>';
    const icon = L.divIcon({
      className: 'pin-wrap',
      html: `<span class="pin" aria-hidden="true">${drop}</span>`,
      iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -13]
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      })[ch]);
    }

    function formatDate(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      return m ? `${m[3]}/${m[2]}/${m[1]}` : '';
    }

    function centerOf(geom) {
      if (!geom || !geom.coordinates) return null;
      if (geom.type === 'Point') return { lon: geom.coordinates[0], lat: geom.coordinates[1] };
      const flat = [];
      (function walk(a) { if (typeof a[0] === 'number') flat.push(a); else a.forEach(walk); })(geom.coordinates);
      if (!flat.length) return null;
      const lons = flat.map(c => c[0]), lats = flat.map(c => c[1]);
      return { lon: (Math.min(...lons) + Math.max(...lons)) / 2,
               lat: (Math.min(...lats) + Math.max(...lats)) / 2 };
    }

    function parseGeoJSON(json) {
      const feats = json && Array.isArray(json.features) ? json.features : [];
      const out = [];
      for (const f of feats) {
        const c = centerOf(f.geometry);
        if (!c || !Number.isFinite(c.lat) || !Number.isFinite(c.lon)) continue;
        out.push({ lat: c.lat, lon: c.lon, p: f.properties || {} });
      }
      return out;
    }

    function popupHtml({ lat, lon, p }) {
      const name = p.name || 'Fontanella / punto acqua';
      const address = [p['addr:street'], p['addr:city']].filter(Boolean).join(', ');
      let info = 'Segnata come acqua potabile su OpenStreetMap';
      if (p.drinking_water === 'no') info = 'Indicata come non potabile';

      const extra = [];
      if (p.operator) extra.push('Gestore: ' + p.operator);
      if (p.access === 'yes') extra.push('Accesso libero');
      if (p.fee === 'no') extra.push('Gratuita');
      if (p.wheelchair === 'yes') extra.push('Accessibile in sedia a rotelle');
      const checked = formatDate(p.check_date);
      if (checked) extra.push('Verificata il ' + checked);

      const id = /^(node|way|relation)\/\d+$/.test(p['@id'] || '') ? p['@id'] : '';
      const link = id
        ? `https://www.openstreetmap.org/${id}`
        : `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=18/${lat}/${lon}`;

      return `<div class="popup">
        <strong>${escapeHtml(name)}</strong>
        ${address ? `<small>${escapeHtml(address)}</small>` : ''}
        <small>${escapeHtml(info)}</small>
        ${extra.map(t => `<small>${escapeHtml(t)}</small>`).join('')}
        ${p.note ? `<small>${escapeHtml(p.note)}</small>` : ''}
        <small><a href="${link}" target="_blank" rel="noopener">Apri su OpenStreetMap</a></small>
      </div>`;
    }

    async function loadPoints() {
      try {
        const res = await fetch(DATA_FILE, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const points = parseGeoJSON(await res.json());
        pointsLayer.clearLayers();
        for (const pt of points) {
          L.marker([pt.lat, pt.lon], { icon, title: pt.p.name || 'Fontanella' })
            .bindPopup(popupHtml(pt)).addTo(pointsLayer);
        }
        if (points.length) {
          map.fitBounds(L.latLngBounds(points.map(pt => [pt.lat, pt.lon])),
            { padding: [30, 30], maxZoom: 15 });
          status.textContent = `${points.length} FONTANELLE · LECCE E MARINE`;
        } else {
          status.textContent = 'NESSUNA FONTANELLA NEL FILE.';
        }
      } catch (err) {
        status.textContent = `FILE ${DATA_FILE} NON LETTO (${(err.message || 'ERRORE').toUpperCase()}). SE APRI LA PAGINA DAL DISCO, USA UN SERVER LOCALE.`;
      }
    }

    $('locate').addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert('La geolocalizzazione non è supportata da questo browser.');
        return;
      }
      navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const here = L.circleMarker([lat, lon], {
          radius: 8, color: '#111', weight: 2, fillColor: '#287bff', fillOpacity: 1
        }).bindPopup('La tua posizione');
        if (map._hereMarker) map.removeLayer(map._hereMarker);
        map._hereMarker = here.addTo(map).openPopup();
        map.setView([lat, lon], 17);
      }, () => {
        alert('Posizione non disponibile. Controlla i permessi del browser e riprova.');
      }, { enableHighAccuracy: true, timeout: 10000 });
    });

    window.addEventListener('load', () => map.invalidateSize());
    loadPoints();
  })();
  </script>
</body>
</html>
