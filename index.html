<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>RUNCORE WATER MAP — Lecce</title>
  <meta name="description" content="Trova le fontanelle pubbliche a Lecce. RUNCORE WATER MAP.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { color-scheme: dark; --yellow:#FFF48D; --black:#111; --panel:#1b1b1b; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--black); color:#fff;
      font-family:Arial,Helvetica,sans-serif; }
    .shell { width:100%; height:100vh; height:100dvh; display:flex;
      flex-direction:column; overflow:hidden; }
    header { flex:0 0 auto; display:flex; justify-content:space-between; align-items:center;
      gap:16px; flex-wrap:wrap; padding:18px 22px 14px; }
    .brand { color:#fff; font-size:clamp(22px,4vw,32px); line-height:1;
      font-weight:950; letter-spacing:1.5px; }
    .tagline { margin-top:7px; color:var(--yellow); font-size:11px;
      font-weight:800; letter-spacing:2.5px; }
    .actions { display:flex; gap:9px; flex-wrap:wrap; }
    button { border:0; border-radius:3px; padding:12px 15px; background:var(--yellow);
      color:#111; font-weight:900; cursor:pointer; }
    button.secondary { background:#292929; color:#fff; border:1px solid #555; }
    button.active { background:#fff; color:#111; }
    button:focus-visible { outline:3px solid white; outline-offset:3px; }
    .status { flex:0 0 auto; padding:10px 22px; background:#202020; color:var(--yellow);
      font-size:11px; letter-spacing:1px; min-height:35px; }
    #map { width:100%; flex:1 1 auto; min-height:0; background:#ddd; }
    #map.adding { cursor:crosshair; }
    footer { flex:0 0 auto; display:flex; justify-content:space-between; gap:10px;
      flex-wrap:wrap; padding:10px 22px; color:#aaa; font-size:11px; }
    footer a { color:#ddd; }
    .pin { width:30px; height:30px; display:flex; align-items:center; justify-content:center;
      border:2px solid #111; border-radius:50%; background:var(--yellow);
      box-shadow:0 2px 8px #0008; font-size:16px; }
    .pin.user { border-style:dashed; }
    .pin-wrap { background:transparent; border:0; }
    .leaflet-popup-content-wrapper { border-radius:4px; }
    .popup { color:#151515; min-width:165px; line-height:1.4; }
    .popup strong { font-size:14px; }
    .popup small { display:block; margin-top:5px; color:#555; }
    .popup a { color:#111; font-weight:bold; }
    .popup button { margin-top:8px; padding:7px 10px; font-size:11px; background:#292929; color:#fff; }
    @media(max-width:600px) {
      header { padding:14px 14px 11px; gap:12px; }
      .brand { font-size:22px; }
      .tagline { font-size:9px; letter-spacing:2px; }
      .actions { width:100%; }
      .actions button { flex:1; padding:11px 9px; font-size:11px; }
      .status, footer { padding-left:14px; padding-right:14px; }
      footer { font-size:10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="brand">RUNCORE | WATER MAP</div>
        <div class="tagline">FIND WATER. KEEP RUNNING.</div>
      </div>
      <div class="actions">
        <button id="locate" type="button">◎ DOVE SONO</button>
        <button id="add" class="secondary" type="button">+ AGGIUNGI PUNTO</button>
        <button id="export" class="secondary" type="button">ESPORTA</button>
      </div>
    </header>

    <div id="status" class="status" role="status" aria-live="polite">
      PREPARAZIONE DELLA MAPPA...
    </div>
    <div id="map" aria-label="Mappa delle fontanelle a Lecce"></div>
    <footer>
      <span>● FONTANELLE · LECCE</span>
      <span>I punti possono essere incompleti: verifica sul posto che l’acqua sia potabile.</span>
      <span>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></span>
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
  (() => {
    const DATA_FILE = 'fontanelle.geojson';
    const USER_KEY = 'runcore-water-user-v1';

    const $ = id => document.getElementById(id);
    const status = $('status');
    const mapEl = $('map');
    const addBtn = $('add');

    const map = L.map('map').setView([40.3515, 18.1750], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const pointsLayer = L.layerGroup().addTo(map);
    const userLayer = L.layerGroup().addTo(map);

    const drop = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#1e88e5" stroke="#111" stroke-width="1.5">' +
      '<path d="M12 2.5C12 2.5 5 10 5 14.5a7 7 0 0 0 14 0C19 10 12 2.5 12 2.5z"/></svg>';
    const makeIcon = isUser => L.divIcon({
      className: 'pin-wrap',
      html: `<span class="pin${isUser ? ' user' : ''}" aria-hidden="true">${drop}</span>`,
      iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -13]
    });
    const iconFile = makeIcon(false);
    const iconUser = makeIcon(true);

    let filePoints = [];
    let fileError = '';
    let userPoints = loadUser();
    let adding = false;

    function loadUser() {
      try {
        const v = JSON.parse(localStorage.getItem(USER_KEY) || '[]');
        return Array.isArray(v) ? v.filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon)) : [];
      } catch (_) { return []; }
    }
    function saveUser() {
      try { localStorage.setItem(USER_KEY, JSON.stringify(userPoints)); } catch (_) {}
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      })[ch]);
    }

    // Centro di una geometria GeoJSON (punto, oppure poligono/linea → centro del riquadro)
    function centerOf(geom) {
      if (!geom || !geom.coordinates) return null;
      if (geom.type === 'Point') return { lon: geom.coordinates[0], lat: geom.coordinates[1] };
      const flat = [];
      (function walk(a) {
        if (typeof a[0] === 'number') flat.push(a); else a.forEach(walk);
      })(geom.coordinates);
      if (!flat.length) return null;
      const lons = flat.map(c => c[0]), lats = flat.map(c => c[1]);
      return { lon: (Math.min(...lons) + Math.max(...lons)) / 2,
               lat: (Math.min(...lats) + Math.max(...lats)) / 2 };
    }

    function parseGeoJSON(json) {
      const feats = json && Array.isArray(json.features) ? json.features : [];
      const out = [];
      for (const f of feats) {
        const c = centerOf(f.geometry);
        if (!c || !Number.isFinite(c.lat) || !Number.isFinite(c.lon)) continue;
        const p = f.properties || {};
        out.push({ lat: c.lat, lon: c.lon, name: p.name || '', drinking: p.drinking_water || '' });
      }
      return out;
    }

    function popupHtml(p) {
      const name = p.name || 'Fontanella / punto acqua';
      let info = 'Potabilità non verificata';
      if (p.drinking === 'yes') info = 'Indicata come acqua potabile';
      if (p.drinking === 'no') info = 'Indicata come non potabile';
      if (p.user) info = 'Aggiunta da te su questo dispositivo';
      const remove = p.user ? `<button type="button" class="rm" data-id="${escapeHtml(p.id)}">RIMUOVI</button>` : '';
      return `<div class="popup">
        <strong>${escapeHtml(name)}</strong>
        <small>${escapeHtml(info)}</small>
        <small><a href="https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=18/${p.lat}/${p.lon}"
           target="_blank" rel="noopener">Apri su OpenStreetMap</a></small>
        ${remove}
      </div>`;
    }

    function render() {
      pointsLayer.clearLayers();
      userLayer.clearLayers();
      for (const p of filePoints) {
        L.marker([p.lat, p.lon], { icon: iconFile }).bindPopup(popupHtml(p)).addTo(pointsLayer);
      }
      for (const p of userPoints) {
        L.marker([p.lat, p.lon], { icon: iconUser })
          .bindPopup(popupHtml({ ...p, user: true })).addTo(userLayer);
      }
      updateStatus();
    }

    function updateStatus() {
      if (adding) { status.textContent = 'TOCCA LA MAPPA NEL PUNTO DELLA FONTANELLA.'; return; }
      const total = filePoints.length + userPoints.length;
      const parts = [];
      if (total) {
        parts.push(`${total} FONTANELLE · LECCE`);
        if (userPoints.length) parts.push(`${userPoints.length} AGGIUNTE DA TE (SOLO SU QUESTO DISPOSITIVO)`);
      } else {
        parts.push('NESSUNA FONTANELLA AL MOMENTO. USA + AGGIUNGI PER INSERIRNE UNA.');
      }
      if (fileError) parts.push(fileError);
      status.textContent = parts.join(' · ');
    }

    async function loadFile() {
      try {
        const res = await fetch(DATA_FILE, { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        filePoints = parseGeoJSON(await res.json());
        fileError = '';
      } catch (err) {
        filePoints = [];
        fileError = `FILE ${DATA_FILE} NON LETTO (${(err.message || 'ERRORE').toUpperCase()})`;
      }
      render();
    }

    function setAdding(on) {
      adding = on;
      mapEl.classList.toggle('adding', on);
      addBtn.classList.toggle('active', on);
      addBtn.textContent = on ? 'ANNULLA' : '+ AGGIUNGI PUNTO';
      updateStatus();
    }
    addBtn.addEventListener('click', () => setAdding(!adding));

    map.on('click', e => {
      if (!adding) return;
      const name = window.prompt('Nome o indicazione (facoltativo)', '');
      if (name === null) { setAdding(false); return; }
      userPoints.push({
        id: 'u' + Date.now().toString(36),
        lat: +e.latlng.lat.toFixed(6),
        lon: +e.latlng.lng.toFixed(6),
        name: name.trim()
      });
      saveUser();
      setAdding(false);
      render();
    });

    map.on('popupopen', e => {
      const btn = e.popup.getElement().querySelector('.rm');
      if (!btn) return;
      btn.addEventListener('click', () => {
        userPoints = userPoints.filter(p => p.id !== btn.dataset.id);
        saveUser();
        map.closePopup();
        render();
      });
    });

    $('export').addEventListener('click', () => {
      const all = [...filePoints, ...userPoints];
      if (!all.length) { status.textContent = 'NIENTE DA ESPORTARE: NESSUN PUNTO PRESENTE.'; return; }
      const geojson = {
        type: 'FeatureCollection',
        features: all.map(p => ({
          type: 'Feature',
          properties: Object.assign({ amenity: 'drinking_water' },
            p.name ? { name: p.name } : {},
            p.drinking ? { drinking_water: p.drinking } : {}),
          geometry: { type: 'Point', coordinates: [p.lon, p.lat] }
        }))
      };
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/geo+json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = DATA_FILE;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      status.textContent = `ESPORTATO ${DATA_FILE} (${all.length} PUNTI). SOSTITUISCI QUELLO NEL REPO PER PUBBLICARLI.`;
    });

    $('locate').addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert('La geolocalizzazione non è supportata da questo browser.');
        return;
      }
      navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const here = L.circleMarker([lat, lon], {
          radius: 8, color: '#111', weight: 2, fillColor: '#287bff', fillOpacity: 1
        }).bindPopup('La tua posizione');
        if (map._hereMarker) map.removeLayer(map._hereMarker);
        map._hereMarker = here.addTo(map).openPopup();
        map.setView([lat, lon], 17);
      }, () => {
        alert('Posizione non disponibile. Controlla i permessi del browser e riprova.');
      }, { enableHighAccuracy: true, timeout: 10000 });
    });

    window.addEventListener('load', () => map.invalidateSize());
    loadFile();
  })();
  </script>
</body>
</html>
